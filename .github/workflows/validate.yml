name: Validate Awesome List

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Markdown & Link Validator
        run: python scripts/check_list.py

      - name: Run Unit Tests
        run: python -m unittest test_check_list.py
